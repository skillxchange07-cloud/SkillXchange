{% extends "base.html" %}
{% block title %}Edit Skill{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row w-100 justify-content-center">
        <div class="col-md-8">
            <div class="card glass-card border-0 p-5 shadow-sm">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-edit text-primary fs-1 mb-2"></i>
                    <h2 class="fw-bold">Update Your Skill</h2>
                    <p class="text-muted">Modify your course details. Note: Changing the video will send it back for Admin re-verification.</p>
                </div>
                
                <form method="POST" action="{{ url_for('skills.edit_skill', skill_id=skill.id) }}" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small fw-bold">Skill Name</label>
                            <input type="text" class="form-control" name="skill_name" required value="{{ skill.skill_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small fw-bold">Category</label>
                            <select class="form-control" name="category" required>
                                <option value="Programming" {% if skill.category == 'Programming' %}selected{% endif %}>Programming</option>
                                <option value="Design" {% if skill.category == 'Design' %}selected{% endif %}>Design</option>
                                <option value="Marketing" {% if skill.category == 'Marketing' %}selected{% endif %}>Marketing</option>
                                <option value="Data Science" {% if skill.category == 'Data Science' %}selected{% endif %}>Data Science</option>
                                <option value="Business" {% if skill.category == 'Business' %}selected{% endif %}>Business</option>
                                <option value="Music" {% if skill.category == 'Music' %}selected{% endif %}>Music</option>
                                <option value="Languages" {% if skill.category == 'Languages' %}selected{% endif %}>Languages</option>
                                <option value="Others" {% if skill.category == 'Others' %}selected{% endif %}>Others</option>
                            </select>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label text-muted small fw-bold">Detailed Description</label>
                            <textarea class="form-control" name="description" rows="5" required>{{ skill.description }}</textarea>
                        </div>
                        <div class="col-12 mb-4">
                            <label class="form-label text-muted small fw-bold">Replace Demo Video (.mp4, .mov)</label>
                            <input type="file" class="form-control" name="demo_video" accept="video/mp4,video/x-m4v,video/*">
                            <div class="form-text mt-2"><i class="fa-solid fa-info-circle text-primary"></i> Leave blank to keep your current video. Maximum limit: 50MB.</div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end mt-2">
                        <a href="{{ url_for('auth.dashboard') }}" class="btn btn-light rounded-pill px-4 py-2 me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
